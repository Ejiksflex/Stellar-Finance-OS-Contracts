name: Bug report
description: A contract, script or workflow behaves differently from the README.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Don't file it here. Use private reporting instead (see SECURITY.md).
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [approval-vault, invoice-registry, common, scripts, CI / workflows, docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ideally a failing `#[test]`, or the exact `stellar contract invoke` command.
      render: rust
  - type: input
    id: version
    attributes:
      label: Version / commit
